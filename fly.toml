# API backend for the public split deploy. The static frontend lives on
# Netlify; this runs server.py behind the existing Dockerfile.
#
#   fly launch --no-deploy       # create the app and choose a region
#   fly secrets set ...          # see SECURITY.md; BYO-key is preferred
#   fly deploy
#
# Deliberately absent: TRUST_PROXY. Requests arrive straight from the public
# internet, so the socket address is the real client and the per-IP rate limit
# works as designed. Setting it here would make that limit forgeable through
# X-Forwarded-For. See SECURITY.md.

app = "financial-regret"
# Region: Fly has no India location, so this is Singapore, the closest one to an
# Indian audience. The store region is unrelated -- PlatPrices still gets
# region=in for INR pricing; this is only where the API process runs.
primary_region = "sin"

[build]
  # The Dockerfile already binds HOST=0.0.0.0 and PORT=8080.

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # Public by default: without this, every visitor spends your API keys.
  REQUIRE_USER_KEYS = "1"
  RATE_LIMIT_PER_MIN = "120"
  # The static frontend on Netlify. Without this every cross-origin call from it
  # is refused, so it must match the deployed Netlify site origin exactly.
  CORS_ALLOWED_ORIGINS = "https://financial-regret.netlify.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/api/health"

# When the on-disk price cache lands, add a volume here and mount it under
# /data. server.py is single-process and stateless today, so there is nothing
# to persist yet.
