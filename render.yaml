# Backend API for the split deploy. The static frontend lives on Netlify; this
# runs server.py from the Dockerfile at the repo root.
#
# Render rather than Fly: Fly requires payment information before an app can be
# created, and Render's free tier does not. Render's own FAQ is written for that
# case -- if you have no payment method on file and would incur charges, Render
# disables the service for the billing period instead of billing you.
#
# Free-tier costs to expect: the instance spins down after 15 idle minutes and
# takes about a minute to come back, and Render may restart it at any time.
# Nothing here depends on surviving a restart: server.py keeps no state on disk.

services:
  - type: web
    name: financial-regret-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Render has no India region; Singapore is the closest of the five.
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # server.py defaults HOST to localhost, which would refuse every external
      # request, so bind explicitly. PORT is deliberately absent: Render manages
      # it (default 10000) and server.py already reads $PORT.
      - key: HOST
        value: "0.0.0.0"
      # Without this every visitor spends the operator's API keys. See SECURITY.md.
      - key: REQUIRE_USER_KEYS
        value: "1"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      # The deployed Netlify site. Without it every cross-origin call is refused.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://financial-regret.netlify.app"
